
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM Toner Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8eef7, #cbd9ec);
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(20, 45, 80, 0.15);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #123d72;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 22px;
            color: #17365d;
        }

        .subtitle {
            margin: 9px 0 28px;
            text-align: center;
            color: #68778a;
            font-size: 13px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            color: #27384d;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrap {
            display: flex;
            gap: 8px;
        }

        .password-wrap input {
            flex: 1;
            min-width: 0;
        }

        .show-btn {
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #174a85;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #103765;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 7px;
            background: #fff1f0;
            color: #a12720;
            font-size: 13px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #788596;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">SPM</div>

        <h1>TONER MANAGEMENT</h1>
        <p class="subtitle">The Sirpur Paper Mills Ltd.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">Password</label>
            <div class="password-wrap">
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button
                    class="show-btn"
                    type="button"
                    onclick="togglePassword()"
                >Show</button>
            </div>

            <button class="login-btn" type="submit">
                Sign In
            </button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="footer">
            Authorized users only
        </div>
    </main>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".show-btn");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>
</body>
</html>
